    <!-- viewport-fit=cover lets the app draw under a phone's notch / home bar (the
    layout then pads for env(safe-area-inset-*)). The rest tell the browser and
    iOS to treat the installed app as a standalone app: no browser chrome, a
    status bar that matches the header (theme-color is kept in sync with the
    light / dark theme by data/theme.js), and its own name and home-screen icon. -->

  <link rel="manifest" href="/assets/janadhikara/frontend/manifest.webmanifest"></head>
  <body>
    <div id="app">
      <!-- Shown the instant the page arrives, until the app draws over it (Vue replaces this on mount). -->
      <div id="boot" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;color:#6b7280;background:#fff">
        <div style="width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#6b7280;border-radius:50%;animation:boot-spin .8s linear infinite"></div>
        <div>Loading Janadhikara…</div>
        <div id="boot-slow" style="display:none;text-align:center;font-size:14px">
          Taking longer than usual.<br />
          <button id="boot-reload" style="margin-top:10px;padding:8px 16px;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb;font-size:14px">Reload</button>
        </div>
      </div>
    </div>
    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){ #boot{background:#0f0f0f!important;color:#9ca3af!important}}</style>
    <script>
      // If the app has not drawn after 10 s (a stalled request, an out-of-date saved copy), offer a clean reload.
      setTimeout(function () {
        var slow = document.getElementById('boot-slow')
        if (!slow) return
        slow.style.display = 'block'
        document.getElementById('boot-reload').onclick = function () {
          var done = function () { location.reload() }
          try {
            var jobs = []
            if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n) })) }))
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister() })) }))
            Promise.all(jobs).then(done, done)
          } catch (e) { done() }
        }
      }, 10000)
    </script>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
