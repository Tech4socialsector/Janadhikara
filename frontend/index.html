<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under a phone's notch / home bar (the
    layout then pads for env(safe-area-inset-*)). The rest tell the browser and
    iOS to treat the installed app as a standalone app: no browser chrome, a
    status bar that matches the header (theme-color is kept in sync with the
    light / dark theme by data/theme.js), and its own name and home-screen icon. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hyderabad Dignified" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="icon" id="app-favicon" href="/favicon.png" />
    <!-- iPhone launch screens: iOS shows one of these while the installed app starts (picked by screen size). -->
    <link rel="apple-touch-startup-image" href="/splash/iphone-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/splash/iphone-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <title>Hyderabad Dignified</title>
    <script>
      // Size of the app on computer screens. Everything in the app follows the root font size (see index.css), set here
      // before first paint from the window's PHYSICAL width: 15px on a 1280-wide screen up to 16px from 1600 up. A screen
      // with Windows / Linux display scaling (125%, 150%) is compensated only HALF-way (SCALE_SHARE): fully matching a
      // 100% screen made the app look small on laptops, whose pixels are smaller and viewed closer. 1 = match exactly,
      // 0 = no compensation. Browser zoom (Ctrl +/-) is left alone (estimated from the window's outer / inner width).
      // Phones and tablets (a touch screen as the main input) keep the plain 16px.
      (function () {
        var SCALE_SHARE = 0.5
        var root = document.documentElement
        function apply() {
          try {
            var dpr = window.devicePixelRatio || 1
            var zoom = window.outerWidth && window.innerWidth ? Math.min(3, window.outerWidth / window.innerWidth) : 1
            if (zoom < 1.15) zoom = 1
            var os = Math.max(1, dpr / zoom)
            var physical = window.innerWidth * dpr
            if (window.matchMedia('(pointer: coarse)').matches || physical < 1000) {
              root.style.removeProperty('--ui-root')
              root.style.removeProperty('--ui-tile-scale')
              return
            }
            var base = Math.min(16, Math.max(15, 15 + (physical - 1280) / 320))
            root.style.setProperty('--ui-root', (base / Math.pow(os, SCALE_SHARE)).toFixed(3) + 'px')
            // the Home screen's module tiles keep exactly their Linux (100%) size - they are the largest thing on screen
            root.style.setProperty('--ui-tile-scale', (16 / base / Math.pow(os, SCALE_SHARE)).toFixed(4))
          } catch (e) {}
        }
        apply()
        window.addEventListener('resize', apply)
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Blank, in the theme's colour (no white flash in dark mode), until the app draws over it (Vue replaces this on mount). Only if the app has not drawn after 10 s does it say so (see the script below). -->
      <div id="boot" style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;color:#6b7280;background:#fff">
        <div id="boot-slow" style="display:none;text-align:center;font-size:14px">
          Taking longer than usual.<br />
          <button id="boot-reload" style="margin-top:10px;padding:8px 16px;border:1px solid #d1d5db;border-radius:8px;background:#f9fafb;font-size:14px">Reload</button>
        </div>
      </div>
    </div>
    <style>@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){ #boot{background:#0f0f0f!important;color:#9ca3af!important}}</style>
    <script>
      // If the app has not drawn after 10 s (a stalled request, an out-of-date saved copy), offer a clean reload.
      setTimeout(function () {
        var slow = document.getElementById('boot-slow')
        if (!slow) return
        slow.style.display = 'block'
        document.getElementById('boot-reload').onclick = function () {
          var done = function () { location.reload() }
          try {
            var jobs = []
            if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n) })) }))
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister() })) }))
            Promise.all(jobs).then(done, done)
          } catch (e) { done() }
        }
      }, 10000)
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
